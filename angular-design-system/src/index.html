<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <title>Kirilla Réka gyógytornász‑fizioterapeuta</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta name="theme-color" content="#FBF2F1">
  <script>
    /* Set the theme before first paint to avoid a light→dark flash. Mirrors core/theme.service.ts:
       an explicit saved choice wins, otherwise follow the OS preference. */
    (function () {
      try {
        var saved = localStorage.getItem('kp-theme');
        var theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#1E1216');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
