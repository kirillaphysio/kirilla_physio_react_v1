<label class="kp-field">
  @if (label(); as l) {
    <span class="kp-field__label">
      {{ l }}@if (required()) {<span class="kp-field__req"> *</span>}
    </span>
  }
  <span class="kp-field__control" [class.is-invalid]="invalid()" [class.is-disabled]="disabled()">
    @if (icon()) {
      <kp-icon [name]="icon()!" class="kp-field__icon" />
    }
    <input
      class="kp-field__input"
      [type]="type()"
      [attr.name]="name()"
      [value]="value()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [required]="required()"
      [attr.aria-invalid]="invalid() ? 'true' : null"
      (input)="onInput($event)"
    />
  </span>
  @if (error() || helper(); as msg) {
    <span class="kp-field__msg" [class.is-invalid]="invalid()">{{ error() || helper() }}</span>
  }
</label>
