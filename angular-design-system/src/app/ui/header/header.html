<div class="kp-header__bar">
  <kp-wordmark class="kp-header__brand" href="/" />

  <nav class="kp-header__nav" aria-label="Fő navigáció">
    @for (item of items; track item.href) {
      <a
        class="kp-header__link"
        [routerLink]="item.href"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: item.href === '/' }"
        >{{ item.label }}</a
      >
    }
  </nav>

  <div class="kp-header__actions">
    <kp-icon-button
      class="kp-header__theme"
      [icon]="theme() === 'dark' ? 'sun' : 'moon'"
      [ariaLabel]="theme() === 'dark' ? 'Világos mód' : 'Sötét mód'"
      variant="soft"
      (clicked)="toggleTheme()"
    />
    <div class="kp-header__toggle" [class.is-open]="open()">
      <kp-icon-button
        [icon]="open() ? 'xmark' : 'bars'"
        ariaLabel="menü"
        variant="soft"
        (clicked)="toggle()"
      />
    </div>
  </div>
</div>

<div
  class="kp-header__sheet"
  [class.is-open]="open()"
  [attr.inert]="open() ? null : ''"
  [attr.aria-hidden]="open() ? null : 'true'"
>
  @for (item of items; track item.href) {
    <a
      class="kp-header__link"
      [routerLink]="item.href"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: item.href === '/' }"
      (click)="close()"
      >{{ item.label }}</a
    >
  }
</div>
