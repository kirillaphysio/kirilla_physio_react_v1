<div class="faq">
  @for (item of items(); track $index) {
    <div class="faq__item" [class.is-open]="isOpen($index)">
      <button
        type="button"
        class="faq__q"
        [attr.aria-expanded]="isOpen($index)"
        (click)="toggle($index)"
      >
        <kp-icon name="chevron-down" class="faq__chevron" />
        <span class="faq__q-text">{{ item.question }}</span>
      </button>
      <div class="faq__panel">
        <div class="faq__panel-inner">
          <div class="faq__answer">{{ item.answer }}</div>
        </div>
      </div>
    </div>
  }
</div>
