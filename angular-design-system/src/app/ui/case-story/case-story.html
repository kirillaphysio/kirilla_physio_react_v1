<kp-card [surface]="surface()" padding="lg" radius="xl">
  <div class="kp-case">
    @if (meta()) {
      <kp-eyebrow>{{ meta() }}</kp-eyebrow>
    }
    <h3 class="kp-case__title">{{ title() }}</h3>

    <div class="kp-case__blocks">
      @for (block of blocks(); track $index) {
        <div class="kp-case__block">
          <span class="kp-case__label">{{ block.label }}</span>
          <p class="kp-case__text kp-rich" [innerHTML]="block.text"></p>
        </div>
      }
    </div>

    @if (outcome()) {
      <div class="kp-case__outcome">
        <kp-icon name="check" class="kp-case__outcome-icon" />
        <p class="kp-case__outcome-text">{{ outcome() }}</p>
      </div>
    }

    @if (therapies().length) {
      <div class="kp-case__chips">
        @for (t of therapies(); track t) {
          <kp-chip size="sm" tone="plum">{{ t }}</kp-chip>
        }
      </div>
    }
  </div>
</kp-card>
