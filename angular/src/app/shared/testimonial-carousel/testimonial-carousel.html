<swiper-container
  [autoplay]="autoplay"
  grab-cursor="true"
  loop="true"
  navigation="true"
  [pagination]="pagination"
  [attr.slides-per-view]="isMobile() ? 1 : 3"
  space-between="32"
>
  @for (testimonial of testimonials(); track testimonial.author) {
    <swiper-slide class="opinion">
      <p class="message">{{ testimonial.description }}</p>
      <div class="author">{{ testimonial.author }}</div>
    </swiper-slide>
  }
</swiper-container>
