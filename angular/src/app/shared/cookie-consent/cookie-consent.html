@if (bannerOpen()) {
  <div class="cookie-banner" role="region" aria-label="Cookie hozzájárulás">
    <h2>Ez a weboldal sütiket használ</h2>
    <p>
      Kedves látogató! Szeretném felhívni a figyelmedet, hogy a honlap a felhasználói élmény
      fokozásának érdekében sütiket használ. További információkért kérlek olvasd el az
      <a routerLink="/privacy">Adatvédelmi Nyilatkozatot</a>.
    </p>
    <div class="actions">
      <button type="button" class="decline-button" (click)="decline()">Elutasítom</button>
      <button type="button" class="accept-button" (click)="accept()">Elfogadom</button>
    </div>
  </div>
}

@if (showReopenButton()) {
  <button type="button" class="reopen-button" (click)="reopen()">Süti beállítások</button>
}
